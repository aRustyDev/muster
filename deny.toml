# cargo-deny configuration (added 2026-08-03, QF slice / QR-2 W-5).
# `just deny` runs `cargo deny check`: advisories (subsumes the cargo-audit
# promise in Rule 09), licenses, bans, sources. CI wiring follows RR&P-1
# (GitHub Actions, owner-confirmed 2026-08-03).

[graph]
all-features = true

[advisories]
# Defaults: RustSec advisory DB; any vulnerability fails. A vulnerable-dep
# exception requires a phase-doc line with a removal date (Rule 09).

[licenses]
# Tightened 2026-08-03 (owner-confirmed) from the provisional permissive
# set to the MINIMAL load-bearing set: every entry below is required by at
# least one crate that offers no alternative —
#   MIT / Apache-2.0    the bulk of the tree (and the workspace's own)
#   BSD-2-Clause        arrayref (sole license)
#   BSD-3-Clause        matchit (MIT AND BSD-3-Clause)
#   ISC                 libloading (sole license)
#   Unicode-3.0         unicode-ident ((MIT OR Apache-2.0) AND Unicode-3.0)
#   Zlib                const_format, konst, foldhash, slotmap (sole)
# Dropped as non-load-bearing (every holder is dual-licensed): CC0-1.0,
# Unlicense, MIT-0, BSL-1.0, Apache-2.0 WITH LLVM-exception. A new license
# entering the tree now fails `just deny` and forces a conscious edit here.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
# warn, not deny: known duplicates exist today (syn, thiserror, winnow,
# windows-sys, …) via transitive pins — denying would gate on upstreams.
multiple-versions = "warn"
# warn, not deny: the only wildcards are the workspace's own path deps,
# and cargo-deny's allow-wildcard-paths exemption applies only to crates
# marked publish = false — whether these crates ever publish to crates.io
# is an undecided owner question this config must not settle. Revisit at
# the first release-please release (deny + allow-wildcard-paths if
# publish = false lands; deny + versioned path deps if publishing).
wildcards = "warn"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
