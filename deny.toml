# cargo-deny configuration (added 2026-08-03, QF slice / QR-2 W-5).
# `just deny` runs `cargo deny check`: advisories (subsumes the cargo-audit
# promise in Rule 09), licenses, bans, sources. CI wiring follows RR&P-1
# (GitHub Actions, owner-confirmed 2026-08-03).

[graph]
all-features = true

[advisories]
# Defaults: RustSec advisory DB; any vulnerability fails. A vulnerable-dep
# exception requires a phase-doc line with a removal date (Rule 09).

[licenses]
# PROVISIONAL allow-list (owner touchpoint, one line to confirm): standard
# permissive set compatible with this workspace's MIT OR Apache-2.0.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
