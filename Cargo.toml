[workspace]
resolver = "2"
members = [
    "crates/orrery",
    "crates/muster-sdk",
    "crates/muster",
    # ADR-0025 (Phase 6 slice 2): delivery crates — server owns the wire
    # and the privacy boundary; ui is dioxus over muster-types DTOs.
    "crates/muster-types",
    "crates/muster-server",
    "crates/muster-ui",
]
# tools/screening is the Phase-1b throwaway harness: its own workspace, its
# own datastore dependencies (Rule 06 keeps those out of the product crates).
exclude = ["tools/screening"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aRustyDev/muster"

# Single version source (Rule 06 / ADR-0022). Crates declare
# `dep.workspace = true`. Adding a dependency to orrery requires an ADR;
# to muster-sdk or muster, a phase-document line.
[workspace.dependencies]
orrery = { path = "crates/orrery" }
muster-sdk = { path = "crates/muster-sdk" }
muster = { path = "crates/muster" }
muster-types = { path = "crates/muster-types" }

thiserror = "2"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v7", "serde"] }
tracing = "0.1"
blake3 = "1"
salsa = "0.28"
petgraph = "0.8"
rand = "0.9"
anyhow = "1"

# ADR-0025 delivery stack (muster-server / muster-ui ONLY — never the
# libraries; check-seam and check-scope enforce).
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde_json = "1"
figment = { version = "0.10", features = ["env"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
dioxus = "0.7"
tower = { version = "0.5", features = ["util"] }

proptest = "1"
